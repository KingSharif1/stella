 fill="#f1f1f3">Roomba 694</text><text x="326" y="834" font-size="12.5" fill="#9b9ba4">motors · brushes · battery</text><path d="M415 884V668" fill="none" stroke="#3ecf8e" stroke-width="2.4" marker-end="url(#ag)" marker-start="url(#sg)"/><text x="425" y="716" font-size="12.5" fill="#3ecf8e" text-anchor="start" font-family="JetBrains Mono,monospace">serial cable</text><rect x="550" y="780" width="210" height="100" rx="14" fill="#17171a" stroke="#7aa2ff" stroke-width="1.5"/><text x="566" y="810" font-size="16" font-weight="700" fill="#f1f1f3">RPLIDAR C1</text><text x="566" y="834" font-size="12.5" fill="#9b9ba4">spins, measures distance</text><path d="M655 884V668" fill="none" stroke="#7aa2ff" stroke-width="2.4" marker-end="url(#ab)" marker-start="url(#sb)"/><text x="665" y="716" font-size="12.5" fill="#7aa2ff" text-anchor="start" font-family="JetBrains Mono,monospace">USB</text><rect x="790" y="780" width="220" height="100" rx="14" fill="#17171a" stroke="#ff5a1f" stroke-width="1.5"/><text x="806" y="810" font-size="16" font-weight="700" fill="#f1f1f3">USB mic</text><text x="806" y="834" font-size="12.5" fill="#9b9ba4">you speak here</text><path d="M900 884V668" fill="none" stroke="#ff5a1f" stroke-width="2.4" marker-end="url(#ao)" marker-start="url(#so)"/><text x="910" y="716" font-size="12.5" fill="#ff5a1f" text-anchor="start" font-family="JetBrains Mono,monospace">USB</text><rect x="1040" y="780" width="210" height="100" rx="14" fill="#17171a" stroke="#ff5a1f" stroke-width="1.5"/><text x="1056" y="810" font-size="16" font-weight="700" fill="#f1f1f3">Speaker</text><text x="1056" y="834" font-size="12.5" fill="#9b9ba4">Stella talks here</text><path d="M1145 884V668" fill="none" stroke="#ff5a1f" stroke-width="2.4" marker-end="url(#ao)" marker-start="url(#so)"/><text x="1155" y="716" font-size="12.5" fill="#ff5a1f" text-anchor="start" font-family="JetBrains Mono,monospace">audio out</text><circle cx="800" cy="782" r="12" fill="#ff5a1f"/><text x="800" y="787" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">1</text><circle cx="800" cy="578" r="12" fill="#ff5a1f"/><text x="800" y="583" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">2</text><circle cx="750" cy="382" r="12" fill="#ff5a1f"/><text x="750" y="387" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">3</text><circle cx="1050" cy="578" r="12" fill="#ff5a1f"/><text x="1050" y="583" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">5</text><circle cx="1220" cy="517" r="12" fill="#ff5a1f"/><text x="1220" y="522" font-size="13" font-weight="700" fill="#0a0a0b" text-anchor="middle">4</text><rect x="20" y="910" width="1260" height="100" rx="22" fill="#0e0e10" stroke="#26262a" stroke-width="1.5"/><text x="44" y="936" font-size="12.5" letter-spacing="1.6" fill="#9b9ba4" font-family="JetBrains Mono,monospace">POWER AND WAKE WIRE</text><text x="44" y="974" font-size="13.5" fill="#d4d4da">Power: Roomba battery → fuse → buck converter → Pi 5 V.     Wake: Pi GPIO17 → 1 kΩ → transistor → Roomba BRC pin (pulses to wake her).</text><text x="44" y="1000" font-size="12.5" fill="#9b9ba4">Wake wire is designed, not wired yet. Everything else here is running or built.</text><rect x="60" y="1034" width="28" height="5" rx="2" fill="#ff5a1f"/><text x="98" y="1042" font-size="13" fill="#9b9ba4">voice path</text><rect x="230" y="1034" width="28" height="5" rx="2" fill="#7aa2ff"/><text x="268" y="1042" font-size="13" fill="#9b9ba4">data / video</text><rect x="400" y="1034" width="28" height="5" rx="2" fill="#3ecf8e"/><text x="438" y="1042" font-size="13" fill="#9b9ba4">control</text><text x="580" y="1042" font-size="13" fill="#9b9ba4">Voice path: ① mic hears → ② wake word → ③ router → ④ action runs on the bus → ⑤ Stella speaks</text></svg>
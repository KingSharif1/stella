" stroke="#3a3a40" stroke-width="1.5"/><text x="416" y="100" font-size="16" font-weight="700" fill="#f1f1f3">Stella OS website</text><text x="416" y="124" font-size="12.5" fill="#9b9ba4">Vercel · Next.js</text><text x="416" y="142" font-size="12.5" fill="#9b9ba4">the page you load</text><rect x="740" y="70" width="250" height="110" rx="14" fill="#17171a" stroke="#3a3a40" stroke-width="1.5"/><text x="756" y="100" font-size="16" font-weight="700" fill="#f1f1f3">Claude AI</text><text x="756" y="124" font-size="12.5" fill="#9b9ba4">Anthropic · the smart brain</text><text x="756" y="142" font-size="12.5" fill="#9b9ba4">used only for hard asks</text><rect x="1040" y="70" width="210" height="110" rx="14" fill="#17171a" stroke="#3a3a40" stroke-width="1.5"/><text x="1056" y="100" font-size="16" font-weight="700" fill="#f1f1f3">3 Roku TVs</text><text x="1056" y="124" font-size="12.5" fill="#9b9ba4">75 Living · ds twin</text><text x="1056" y="142" font-size="12.5" fill="#9b9ba4">sharif d ace</text><path d="M310 125H398" fill="none" stroke="#7aa2ff" stroke-width="2.4" marker-end="url(#ab)"/><text x="354" y="116" font-size="12.5" fill="#9bb8ff" text-anchor="middle" font-family="JetBrains Mono,monospace">loads</text><path d="M650 125H738" fill="none" stroke="#7aa2ff" stroke-width="2.4" marker-end="url(#ab)"/><text x="694" y="116" font-size="12.5" fill="#9bb8ff" text-anchor="middle" font-family="JetBrains Mono,monospace">chat</text><rect x="20" y="215" width="1260" height="70" rx="22" fill="#12151c" stroke="#2a3550" stroke-width="1.5"/><text x="44" y="241" font-size="12.5" letter-spacing="1.6" fill="#9b9ba4" font-family="JetBrains Mono,monospace">2 · YOUR HOME Wi-Fi + TAILSCALE (private tunnel to the Pi)</text><rect x="20" y="300" width="1260" height="420" rx="22" fill="#0e0e10" stroke="#4a2a1c" stroke-width="1.5"/><text x="44" y="326" font-size="12.5" letter-spacing="1.6" fill="#9b9ba4" font-family="JetBrains Mono,monospace">3 · STELLA'S BRAIN · Raspberry Pi 4 “stella” · Ubuntu 24.04 · ROS 2 Jazzy</text><rect x="60" y="370" width="250" height="100" rx="14" fill="#17171a" stroke="#7aa2ff" stroke-width="1.5"/><text x="76" y="400" font-size="16" font-weight="700" fill="#f1f1f3">Web server :8000</text><text x="76" y="424" font-size="12.5" fill="#9b9ba4">/live  /command  /camera</text><text x="76" y="442" font-size="12.5" fill="#9b9ba4">/voice  (the dashboard talks here)</text><rect x="400" y="370" width="250" height="100" rx="14" fill="#17171a" stroke="#a78bfa" stroke-width="1.5"/><text x="416" y="400" font-size="16" font-weight="700" fill="#f1f1f3">My commands</text><text x="416" y="424" font-size="12.5" fill="#9b9ba4">your phrases + macros</text><text x="416" y="442" font-size="12.5" fill="#9b9ba4">checked before Claude</text><rect x="740" y="370" width="250" height="100" rx="14" fill="#17171a" stroke="#ff5a1f" stroke-width="1.5"/><text x="756" y="400" font-size="16" font-weight="700" fill="#f1f1f3">AI router</text><text x="756" y="424" font-size="12.5" fill="#9b9ba4">picks ONE safe action</text><text x="756" y="442" font-size="12.5" fill="#9b9ba4">offline fallback · daily cap</text><rect x="1040" y="370" width="210" height="100" rx="14" fill="#17171a" stroke="#3ecf8e" stroke-width="1.5"/><text x="1056" y="400" font-size="16" font-weight="700" fill="#f1f1f3">Roku control</text><text x="1056" y="424" font-size="12.5" fill="#9b9ba4">roku_tv.py</text><text x="1056" y="442" font-size="12.5" fill="#9b9ba4">search · launch · select</text><rect x="60" y="500" width="1180" height="34" rx="10" fill="#1b1b1f" stroke="#44444c"/><text x="650" y="522" font-size="12.5" fill="#d4d4da" text-anchor="middle" font-family="JetBrains Mono,monospace">ROS 2 message bus · every part posts and reads here</text><path d="M185 470V500" stroke="#44444c" stroke-width="2"/><path d="M525 470V500" stroke="#44444c" stroke-width="2"/><path d="M865 470V500" stroke="#44444c" stroke-width="2"/><path d="M1145 470V500" stroke="#44444c" stroke-width="2"/><rect x="60" y="566" width="220" height="100" rx="14" fill="#17171a" stroke="#7aa2ff" stroke-width="1.5"/><text x="76" y="596" font-size="16" font-weight="700" fill="#f1f1f3">Camera service</text><text x="76" y="620" font-size="12.5" fill="#9b9ba4">GStreamer → MJPEG</text><text x="76" y="638" font-size="12.5" fill="#9b9ba4">15 fps</text><rect x="310" y="566" width="210" height="100" rx="14" fill="#17171a" stroke="#3ecf8e" stroke-width="1.5"/><text x="326" y="596" font-size="16" font-weight="700" fill="#f1f1f3">Roomba driver</text><text x="326" y="620" font-size="12.5" fill="#9b9ba4">drive · clean · dock</text><text x="326" y="638" font-size="12.5" fill="#9b9ba4">reads sensors</text><rect x="550" y="566" width="210" height="100" rx="14" fill="#17171a" stroke="#7aa2ff" stroke-width="1.5"/><text x="566" y="596" font-size="16" font-weight="700" fill="#f1f1f3">LiDAR + map</text><text x="566" y="620" font-size="12.5" fill="#9b9ba4">scan → floor plan</text><text x="566" y="638" font-size="12.5" fill="#9b9ba4">10.6 Hz</text><rect x="790" y="566" width="220" height="100" rx="14" fill="#17171a" stroke="#ff5a1f" stroke-width="1.5"/><text x="806" y="596" font-size="16" font-weight="700" fill="#f1f1f3">Voice listener</text><text x="806" y="620" font-size="12.5" fill="#9b9ba4">Vosk · “Stella”</text><text x="806" y="638" font-size="12.5" fill="#9b9ba4">“Kalani bear”</text><rect x="1040" y="566" width="210" height="100" rx="14" fill="#17171a" stroke="#ff5a1f" stroke-width="1.5"/><text x="1056" y="596" font-size="16" font-weight="700" fill="#f1f1f3">Piper voice</text><text x="1056" y="620" font-size="12.5" fill="#9b9ba4">words → speech</text><text x="1056" y="638" font-size="12.5" fill="#9b9ba4">offline</text><path d="M170 534V566" stroke="#44444c" stroke-width="2"/><path d="M415 534V566" stroke="#44444c" stroke-width="2"/><path d="M655 534V566" stroke="#44444c" stroke-width="2"/><path d="M900 534V566" stroke="#44444c" stroke-width="2"/><path d="M1145 534V566" stroke="#44444c" stroke-width="2"/><path d="M185 1